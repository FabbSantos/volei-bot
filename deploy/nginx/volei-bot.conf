# Proxy do painel do vôlei. Vai em /etc/nginx/sites-available/volei-bot,
# com link em sites-enabled. Troque SEU.DOMINIO.COM.BR pelo subdomínio real
# antes de ativar (o certbot reescreve a parte de SSL sozinho).

server {
    listen 80;
    listen [::]:80;
    server_name SEU.DOMINIO.COM.BR;

    # O certbot troca isto por um redirect pro 443 quando emitir o certificado.
    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # O /backup devolve o banco inteiro; sem isto o nginx corta em 1 MB.
        client_max_body_size 0;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
